<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="520" height="180">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFF4A0"/>
      <stop offset="40%"  stop-color="#FFE048"/>
      <stop offset="100%" stop-color="#CC9A00"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFFBE0"/>
      <stop offset="35%"  stop-color="#FFE048"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="125%">
      <feDropShadow dx="3" dy="4" stdDeviation="2" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background pill -->
  <rect x="2" y="2" width="516" height="176" rx="22" fill="#050505" stroke="url(#gold)" stroke-width="3"/>

  <!-- Shaka icon -->
  <g transform="translate(18, 18) scale(0.85)" filter="url(#shadow)">
    <!-- Outer stroke shape -->
    <path d="M72 28 C72 18 62 12 54 16 L36 26 C30 18 20 16 14 22 C8 28 10 40 18 44 L18 100 C18 114 28 124 42 124 L64 124 C78 124 88 114 88 100 L88 54 C88 40 82 30 72 28Z"
          fill="#1a1a00" stroke="url(#gold)" stroke-width="5" stroke-linejoin="round"/>
    <!-- Palm fill -->
    <path d="M72 28 C72 18 62 12 54 16 L36 26 C30 18 20 16 14 22 C8 28 10 40 18 44 L18 100 C18 114 28 124 42 124 L64 124 C78 124 88 114 88 100 L88 54 C88 40 82 30 72 28Z"
          fill="url(#gold)"/>
    <!-- Pinky finger -->
    <rect x="20" y="28" width="13" height="36" rx="6" fill="url(#gold)" stroke="#1a1a00" stroke-width="3"/>
    <!-- Ring finger stub -->
    <rect x="36" y="26" width="13" height="22" rx="6" fill="url(#gold)" stroke="#1a1a00" stroke-width="2"/>
    <!-- Index finger -->
    <rect x="60" y="18" width="13" height="36" rx="6" fill="url(#gold)" stroke="#1a1a00" stroke-width="3"/>
    <!-- Thumb -->
    <ellipse cx="88" cy="72" rx="9" ry="18" fill="url(#gold)" stroke="#1a1a00" stroke-width="3"/>
    <!-- Shine -->
    <ellipse cx="50" cy="60" rx="14" ry="8" fill="rgba(255,255,220,0.18)" transform="rotate(-15,50,60)"/>
  </g>

  <!-- SPACE text -->
  <text
    x="118" y="96"
    font-family="Arial Black, Impact, sans-serif"
    font-size="78"
    font-weight="900"
    letter-spacing="-2"
    fill="url(#goldText)"
    stroke="#050505"
    stroke-width="8"
    stroke-linejoin="round"
    paint-order="stroke fill"
    filter="url(#shadow)"
  >SPACE</text>

  <!-- VIBES text -->
  <text
    x="118" y="164"
    font-family="Arial Black, Impact, sans-serif"
    font-size="78"
    font-weight="900"
    letter-spacing="-2"
    fill="#ffffff"
    stroke="#050505"
    stroke-width="8"
    stroke-linejoin="round"
    paint-order="stroke fill"
    filter="url(#shadow)"
  >VIBES</text>

  <!-- Gold outline on VIBES -->
  <text
    x="118" y="164"
    font-family="Arial Black, Impact, sans-serif"
    font-size="78"
    font-weight="900"
    letter-spacing="-2"
    fill="none"
    stroke="url(#gold)"
    stroke-width="2"
    stroke-linejoin="round"
  >VIBES</text>

  <!-- Star accents -->
  <g fill="url(#gold)" filter="url(#glow)">
    <polygon points="494,22 497,30 505,30 499,35 501,43 494,38 487,43 489,35 483,30 491,30" opacity="0.9"/>
    <polygon points="506,55 508,60 513,60 509,63 510,68 506,65 502,68 503,63 499,60 504,60" opacity="0.6" transform="scale(0.7) translate(220,35)"/>
  </g>
</svg>
